[project]
    name = "esp-idf-defs"
    description = "Python data structures for ESP-IDF internals — partition tables, firmware images, OTA data, and app descriptors"
    dynamic = ["version"]
    dependencies = []

[tool.setuptools]
    packages = ["esp_idf_defs"]

[tool.setuptools_scm]
