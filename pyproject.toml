[build-system]
    requires = ["setuptools>=64", "setuptools-scm"]
    build-backend = "setuptools.build_meta"

[project]
    name = "esp-idf-defs"
    description = "Python data structures for ESP-IDF internals — partition tables, firmware images, OTA data, and app descriptors"
    readme = "README.md"
    license = "Apache-2.0"
    requires-python = ">=3.10"
    dynamic = ["version"]
    dependencies = []

[project.urls]
    Source = "https://github.com/nebkat/py-esp-idf"

[tool.setuptools]
    packages = ["esp_idf_defs"]

[tool.setuptools_scm]
